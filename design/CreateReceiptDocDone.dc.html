<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#faf8f4; --surface:#ffffff; --border:#e8e2d6; --border-soft:#f0ebe0;
    --ink:#221f1a; --ink-soft:#6b6357; --ink-faint:#9a9284;
    --success:#1f9d63; --success-soft:#e7f6ee;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Sarabun',sans-serif;color:var(--ink);}
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
</style>
</helmet>

<div style="width:390px;min-height:820px;background:var(--bg);display:flex;flex-direction:column;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 24px 8px;">
    <div style="width:60px;height:60px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 style="margin:0;font-size:19px;font-weight:700;">สร้างเอกสารเรียบร้อย</h1>
    <span style="font-size:12.5px;color:var(--ink-soft);">แนบไว้ในรายการนี้แล้ว พร้อมส่งตรวจทาน</span>
  </div>

  <!-- mini document preview -->
  <div style="margin:16px 32px 0;padding:18px 20px;border-radius:4px;background:#fff;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);">
    <div style="display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px;">
      <div style="width:26px;height:20px;border:1px dashed var(--ink-faint);border-radius:2px;flex-shrink:0;"></div>
      <div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;">
        <div style="height:5px;width:70%;background:var(--ink);opacity:.8;border-radius:1px;"></div>
        <div style="height:4px;width:85%;background:var(--ink-faint);border-radius:1px;"></div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;font-weight:700;margin-bottom:10px;">เอกสารการรับเงิน</div>
    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px;">
      <div style="height:4px;width:92%;background:var(--ink-faint);opacity:.6;border-radius:1px;"></div>
      <div style="height:4px;width:88%;background:var(--ink-faint);opacity:.6;border-radius:1px;"></div>
      <div style="height:4px;width:60%;background:var(--ink-faint);opacity:.6;border-radius:1px;"></div>
    </div>
    <div style="display:flex;gap:10px;border:1px solid var(--border);border-radius:3px;padding:10px;">
      <div style="width:44px;height:30px;border:1px dashed var(--ink-faint);border-radius:2px;flex-shrink:0;"></div>
      <div style="display:flex;flex-direction:column;gap:4px;justify-content:center;flex-grow:1;">
        <div style="height:3px;width:70%;background:var(--ink-faint);opacity:.5;border-radius:1px;margin:0 auto;"></div>
        <div style="height:3px;width:40%;background:var(--ink-faint);opacity:.7;border-radius:1px;margin:0 auto;"></div>
      </div>
    </div>
  </div>

  <!-- summary -->
  <div style="margin:14px 20px 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--ink-soft);">ผู้รับเงิน</span><span style="font-size:12.5px;font-weight:600;">พิมพ์วดี วงศ์สุรีย์</span></div>
    <div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--ink-soft);">จำนวนเงิน</span><span style="font-size:12.5px;font-weight:700;color:{{accent}};">฿202.00</span></div>
    <div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--ink-soft);">วันที่ออกเอกสาร</span><span style="font-size:12.5px;font-weight:600;">26 ส.ค. 2569</span></div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:18px 20px 26px;display:flex;flex-direction:column;gap:10px;">
    <span style="font-size:11.5px;color:var(--ink-faint);font-weight:600;text-align:center;">ดาวน์โหลดเอกสารได้ทั้ง 2 แบบ</span>
    <div style="display:flex;gap:10px;">
      <button style="all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span style="font-size:13.5px;font-weight:700;">Word</span>
      </button>
      <button style="all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c0362c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span style="font-size:13.5px;font-weight:700;">PDF</span>
      </button>
    </div>
    <button style="all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:48px;border-radius:13px;background:{{accent}};color:#fff;font-size:14.5px;font-weight:700;margin-top:4px;">เสร็จสิ้น กลับไปที่รายการ</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#146b5c","section":"Brand"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#146b5c',
    };
  }
}
</script>
</body>
</html>
